<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小星姐姐 — 成长陪伴室</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #FFF8F0;
    color: #5a4a42;
    display: flex; flex-direction: column;
    height: 100%;
    user-select: none;
  }

  /* ---------- 顶部：圆形头像（小宠物式） ---------- */
  #header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px 10px;
  }
  #avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: #FFF3E0;
    border: 3px solid #f0dcc8;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
    transition: box-shadow 0.3s;
  }
  #avatar.speaking { box-shadow: 0 0 0 6px rgba(255,179,126,0.35); }
  #avatar svg {
    position: absolute; left: 50%; top: 6px;
    transform: translateX(-50%);
    width: 60px; height: 72px;
  }
  #header-name { font-size: 20px; font-weight: 600; }
  #header-state { font-size: 14px; color: #a08b80; }

  /* 表情状态（头像内 SVG） */
  .eye-happy, .eye-blink { opacity: 0; }
  #avatar.happy .eye-open { opacity: 0; }
  #avatar.happy .eye-happy { opacity: 1; }
  #avatar.blink .eye-open { opacity: 0; }
  #avatar.blink .eye-blink { opacity: 1; }
  #avatar .mouth-open1, #avatar .mouth-open2 { display: none; }

  /* ---------- 对话流（微信式） ---------- */
  #history {
    flex: 1; overflow-y: auto; min-height: 0;
    display: flex; flex-direction: column; gap: 12px;
    padding: 10px 16px;
  }
  .msg { display: flex; gap: 10px; animation: pop 0.25s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .msg.kid { flex-direction: row-reverse; }
  .mini-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #FFF3E0; border: 2px solid #f0dcc8;
    overflow: hidden; flex-shrink: 0; position: relative;
  }
  .mini-avatar svg { position: absolute; left: 50%; top: 3px; transform: translateX(-50%); width: 34px; height: 40px; }
  .mini-avatar.kid-face { background: #E3F2FD; border-color: #c8e0f5; display: flex; align-items: center; justify-content: center; }
  .mini-avatar.kid-face svg { position: static; transform: none; width: 22px; height: 22px; }
  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 20px;
    font-size: 18px; line-height: 1.6;
  }
  .msg.sister .bubble { background: #FFF3E0; border-top-left-radius: 4px; }
  .msg.kid .bubble { background: #E3F2FD; border-top-right-radius: 4px; cursor: pointer; }
  /* 识别中的孩子气泡：省略号呼吸动画 */
  .bubble.live { animation: breathe-bubble 1s ease-in-out infinite; }
  @keyframes breathe-bubble { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* ---------- 底部操作栏 ---------- */
  #controls {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 12px 16px 24px;
  }
  #mic-btn {
    width: 88px; height: 88px; border-radius: 50%;
    border: none; cursor: pointer; flex-shrink: 0;
    background: #ffb37e;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(255,179,126,0.4);
    transition: transform 0.15s, background 0.15s;
    touch-action: none;
    position: relative;
  }
  #mic-btn svg { width: 40px; height: 40px; }
  /* 按住说话时：整页高亮 + 按钮脉冲 */
  #mic-btn.recording { background: #ff8a4d; transform: scale(1.18); }
  #mic-btn.recording::after {
    content: '';
    position: absolute; inset: -10px;
    border-radius: 50%;
    border: 4px solid rgba(255,138,77,0.5);
    animation: pulse 1s ease-out infinite;
  }
  @keyframes pulse {
    from { transform: scale(0.9); opacity: 1; }
    to { transform: scale(1.5); opacity: 0; }
  }
  body.recording #history { opacity: 0.45; }
  body.recording #header { opacity: 0.45; }
  /* 录音时整屏暖橙内描边，一眼可辨 */
  body.recording { box-shadow: inset 0 0 0 10px rgba(255,138,77,0.55); }
  #history, #header { transition: opacity 0.2s; }

  #record-banner {
    position: fixed; left: 50%; top: 96px; transform: translateX(-50%);
    background: rgba(90,74,66,0.9); color: #fff;
    padding: 12px 26px; border-radius: 24px; font-size: 18px;
    display: none; z-index: 10;
  }
  body.recording #record-banner { display: block; }

  /* 实时识别气泡：悬浮在麦克风上方 */
  #live-bubble {
    position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%);
    max-width: 82%;
    background: #E3F2FD; color: #5a4a42;
    padding: 14px 20px; border-radius: 20px; border-bottom-right-radius: 4px;
    font-size: 19px; line-height: 1.6;
    display: none; z-index: 11;
    box-shadow: 0 4px 16px rgba(90,74,66,0.15);
  }
  body.recording #live-bubble { display: block; }
  #live-bubble.live { animation: breathe-bubble 1.2s ease-in-out infinite; }
  @keyframes breathe-bubble { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  #toast {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(90,74,66,0.85); color: #fff;
    padding: 10px 22px; border-radius: 18px; font-size: 16px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 20;
  }

  /* ---------- 父母设置入口（隐蔽：右上角小齿轮） ---------- */
  #settings-btn {
    margin-left: auto; flex-shrink: 0;
    width: 40px; height: 40px; border-radius: 50%;
    border: none; background: transparent; color: #cdb7a6;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.2s, color 0.2s;
  }
  #settings-btn:active { background: #f6e7d8; color: #8a6f5c; }
  #settings-btn svg { width: 23px; height: 23px; }

  .overlay {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(90,74,66,0.38);
    display: none; align-items: center; justify-content: center;
    padding: 18px;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .overlay.show { display: flex; }

  /* 密码弹层 */
  #gate-card {
    background: #fff; border-radius: 22px; padding: 22px;
    width: 320px; max-width: 100%; text-align: center;
    box-shadow: 0 14px 40px rgba(90,74,66,0.25);
  }
  #gate-card h3 { font-size: 19px; margin-bottom: 4px; }
  #gate-card .hint { font-size: 14px; color: #a08b80; margin-bottom: 14px; min-height: 20px; }
  #gate-pass {
    width: 100%; font-size: 24px; letter-spacing: 10px; text-align: center;
    padding: 12px 6px 12px 16px; border: 2px solid #f0dcc8; border-radius: 14px;
    background: #FFF8F0; color: #5a4a42; font-family: inherit; outline: none;
    user-select: text;
  }
  #gate-pass:focus { border-color: #ffb37e; }
  #gate-card .row { display: flex; gap: 10px; margin-top: 14px; }
  #gate-card .row .btn { flex: 1; }
  #gate-card.shake { animation: gate-shake 0.3s; }
  @keyframes gate-shake {
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* 设置面板 */
  #settings-panel {
    background: #FFF8F0; border-radius: 24px;
    width: 780px; max-width: 100%; max-height: 90vh;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 18px 50px rgba(90,74,66,0.3);
  }
  #settings-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 16px 20px 12px; border-bottom: 2px solid #f4e4d4;
  }
  #settings-head h2 { font-size: 20px; }
  #settings-head .sub { font-size: 13px; color: #a08b80; margin-top: 2px; }
  #settings-close {
    margin-left: auto; flex-shrink: 0;
    width: 40px; height: 40px; border-radius: 50%;
    border: none; background: #f6e7d8; color: #8a6f5c;
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  #settings-body { overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 26px; }
  .set-sec { margin-top: 18px; }
  .set-sec h3 { font-size: 16px; color: #8a6f5c; margin-bottom: 10px; }
  .set-card { background: #fff; border: 2px solid #f0dcc8; border-radius: 18px; padding: 14px 16px; }
  .set-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .set-row + .set-row { margin-top: 10px; }
  .set-sub { font-size: 13px; color: #a08b80; }
  .set-label { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .val { font-size: 14px; color: #a08b80; min-width: 38px; }
  .btn {
    font-size: 16px; padding: 9px 18px; border: none; border-radius: 14px;
    background: #ffb37e; color: #fff; cursor: pointer; font-family: inherit;
  }
  .btn:active { background: #f09c60; }
  .btn.ghost { background: #E3F2FD; color: #5a4a42; }
  .btn.small { font-size: 14px; padding: 6px 12px; border-radius: 11px; }
  #settings-panel input[type=text], #settings-panel input[type=password] {
    font-size: 15px; padding: 9px 12px; border: 2px solid #f0dcc8; border-radius: 12px;
    background: #FFF8F0; color: #5a4a42; font-family: inherit;
    flex: 1; min-width: 180px; outline: none; user-select: text;
  }
  #settings-panel input[type=text]:focus, #settings-panel input[type=password]:focus { border-color: #ffb37e; }
  #settings-panel input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 130px; height: 22px; background: transparent; cursor: pointer;
  }
  #settings-panel input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px; background: #f0dcc8;
  }
  #settings-panel input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: #ffb37e; margin-top: -6px; border: none;
    box-shadow: 0 1px 3px rgba(90,74,66,0.2);
  }
  #settings-panel input[type=range]::-moz-range-track {
    height: 6px; border-radius: 3px; background: #f0dcc8;
  }
  #settings-panel input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%; background: #ffb37e; border: none;
  }
  #voice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .vcard {
    background: #fff; border: 2px solid #f0dcc8; border-radius: 14px;
    padding: 10px 12px; display: flex; flex-direction: column; gap: 5px;
  }
  .vcard.selected { border-color: #ffb37e; background: #FFF3E0; }
  .vcard .vname { font-size: 15px; font-weight: 600; }
  .vcard .vtrait { font-size: 12px; color: #a08b80; }
  .vcard .vrow { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .badge { font-size: 12px; color: #ff9a5c; display: none; }
  .vcard.selected .badge { display: inline; }
  .group-label { grid-column: 1 / -1; font-size: 13px; color: #8a6f5c; margin-top: 6px; }
  #set-log {
    font-size: 12px; color: #a08b80; max-height: 120px; overflow-y: auto;
    background: #fff; border: 2px solid #f0dcc8; border-radius: 14px;
    padding: 10px 12px; white-space: pre-wrap; user-select: text;
  }

  /* 窄屏：Key 输入独占一行，保存/清除等分 */
  @media (max-width: 520px) {
    #settings-panel input[type=text], #settings-panel input[type=password] { flex-basis: 100%; }
    #set-key-save, #set-key-clear { flex: 1; }
  }
</style>
</head>
<body>
  <div id="toast"></div>
  <div id="record-banner">正在听你说 <span id="record-secs">0</span>s，松开结束</div>
  <div id="live-bubble" aria-live="polite">正在听…</div>

  <!-- 父母设置：密码门 -->
  <div class="overlay" id="gate">
    <div id="gate-card">
      <h3>父母设置</h3>
      <div class="hint" id="gate-hint">请输入密码</div>
      <input type="password" id="gate-pass" inputmode="numeric" maxlength="6" autocomplete="off">
      <div class="row">
        <button class="btn ghost" id="gate-cancel">取消</button>
        <button class="btn" id="gate-ok">确定</button>
      </div>
    </div>
  </div>

  <!-- 父母设置：面板 -->
  <div class="overlay" id="settings">
    <div id="settings-panel">
      <div id="settings-head">
        <div>
          <h2>父母设置</h2>
          <div class="sub">修改后立即生效</div>
        </div>
        <button id="settings-close" aria-label="关闭">✕</button>
      </div>
      <div id="settings-body">
        <div class="set-sec">
          <h3>接口</h3>
          <div class="set-card">
            <div class="set-row">
              <input type="password" id="set-key" placeholder="百炼 API Key（sk-...，千问+语音共用）">
              <button class="btn" id="set-key-save">保存</button>
              <button class="btn ghost" id="set-key-clear">清除</button>
            </div>
            <div class="set-row"><span class="set-sub" id="set-engine"></span></div>
          </div>
        </div>

        <div class="set-sec">
          <h3>记忆库</h3>
          <div class="set-card">
            <div class="set-row"><span class="set-sub" id="set-db">检查中…</span></div>
          </div>
        </div>

        <div class="set-sec">
          <h3>语音</h3>
          <div class="set-card">
            <div class="set-row">
              <label class="set-label">语速 <input type="range" id="set-rate" min="0.7" max="1.2" step="0.01"> <span class="val" id="set-rate-v"></span></label>
              <label class="set-label">音量 <input type="range" id="set-vol" min="0" max="1" step="0.05"> <span class="val" id="set-vol-v"></span></label>
              <label class="set-label">音效 <input type="range" id="set-sfx" min="0" max="1" step="0.05"> <span class="val" id="set-sfx-v"></span></label>
            </div>
            <div class="set-row">
              <label class="set-label"><input type="checkbox" id="set-tts-on"> 语音开关</label>
            </div>
          </div>
        </div>

        <div class="set-sec">
          <h3>音色（共 <span id="set-voice-count"></span> 个，点击卡片试听即选中）</h3>
          <div id="voice-grid"></div>
        </div>

        <div class="set-sec">
          <h3>核心思想（注入千问 System Prompt）</h3>
          <div class="set-card">
            <div class="set-row" id="set-values-row"></div>
            <div class="set-row">
              <input type="text" id="set-custom-value" placeholder="自定义核心思想（20字内）" maxlength="20">
            </div>
          </div>
        </div>

        <div class="set-sec">
          <h3>禁止话题（千问绝不主动提及，孩子提到就引导问父母）</h3>
          <div class="set-card">
            <div class="set-row" id="set-forbidden-row"></div>
            <div class="set-row">
              <input type="text" id="set-custom-forbidden" placeholder="添加禁止话题，回车确认">
            </div>
            <div class="set-sub" style="margin-top:8px;">回复发出前还会做一次关键词扫描，命中同样拦截。</div>
          </div>
        </div>

        <div class="set-sec">
          <h3>日志</h3>
          <div id="set-log"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="header">
    <div id="avatar">
      <svg viewBox="58 52 84 84" xmlns="http://www.w3.org/2000/svg">
        <path d="M45 130 C38 70 60 30 100 30 C140 30 162 70 155 130 L150 175 C130 165 120 150 118 132 L82 132 C80 150 70 165 50 175 Z" fill="#8a6844"/>
        <ellipse cx="100" cy="105" rx="42" ry="45" fill="#FFE8D6"/>
        <path d="M58 95 C56 58 76 42 100 42 C124 42 144 58 142 95 C132 78 124 74 120 84 C112 70 104 70 100 80 C96 70 88 70 80 84 C76 74 68 78 58 95 Z" fill="#8a6844"/>
        <ellipse cx="72" cy="122" rx="8" ry="5" fill="#FFC0B8" opacity="0.7"/>
        <ellipse cx="128" cy="122" rx="8" ry="5" fill="#FFC0B8" opacity="0.7"/>
        <g class="eye-open">
          <ellipse cx="82" cy="105" rx="6" ry="8" fill="#4a3a32"/>
          <circle cx="84" cy="102" r="2" fill="#fff"/>
          <ellipse cx="118" cy="105" rx="6" ry="8" fill="#4a3a32"/>
          <circle cx="120" cy="102" r="2" fill="#fff"/>
        </g>
        <g class="eye-blink">
          <path d="M76 106 Q82 108 88 106" stroke="#4a3a32" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M112 106 Q118 108 124 106" stroke="#4a3a32" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>
        <g class="eye-happy">
          <path d="M75 104 Q82 97 89 104" stroke="#4a3a32" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M111 104 Q118 97 125 104" stroke="#4a3a32" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
        <path class="mouth-smile" d="M88 132 Q100 141 112 132" stroke="#c96f5e" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse class="mouth-open1" cx="100" cy="135" rx="8" ry="5" fill="#c96f5e"/>
        <ellipse class="mouth-open2" cx="100" cy="136" rx="9" ry="8" fill="#c96f5e"/>
      </svg>
    </div>
    <div>
      <div id="header-name">小星姐姐</div>
      <div id="header-state">在线</div>
    </div>
    <button id="settings-btn" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div id="history"></div>

  <div id="controls">
    <button id="mic-btn" aria-label="按住说话">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0"/>
        <path d="M12 18v3"/>
      </svg>
    </button>
  </div>

<script type="module">
import { tts, COSYVOICE_VOICES } from './js/tts.js';
import { sfx } from './js/sfx.js';
import { asr } from './js/asr.js';
import { replySmart, greeting, sanitize } from './js/brain.js';
import { getParentConfig, setParentConfig } from './js/qwen.js';
import { store } from './js/store.js';
import { memory } from './js/memory.js';

const avatar = document.getElementById('avatar');
const historyEl = document.getElementById('history');
const micBtn = document.getElementById('mic-btn');
const headerState = document.getElementById('header-state');
const toast = document.getElementById('toast');
let blinkTimer = null;
let busy = false;

/* ---------- 头像表情状态机 ---------- */
const SISTER_FACE = avatar.querySelector('svg').outerHTML; // 复用到气泡头像
function setMood(mood) {
  avatar.classList.remove('happy');
  if (mood === 'happy') avatar.classList.add('happy');
  const label = { idle: '在线', talking: '说话中', thinking: '思考中', happy: '好开心', encouraging: '陪着你' };
  headerState.textContent = label[mood] || '在线';
}
function setMouth(f) {
  avatar.querySelector('.mouth-smile').style.display = f === 0 ? '' : 'none';
  avatar.querySelector('.mouth-open1').style.display = f === 1 ? '' : 'none';
  avatar.querySelector('.mouth-open2').style.display = f === 2 ? '' : 'none';
}
function startBlink() {
  clearInterval(blinkTimer);
  blinkTimer = setInterval(() => {
    avatar.classList.add('blink');
    setTimeout(() => avatar.classList.remove('blink'), 160);
  }, 3000 + Math.random() * 2000);
}
startBlink();

/* ---------- 消息流 ---------- */
function addBubble(text, who) {
  const row = document.createElement('div');
  row.className = 'msg ' + who;
  const av = document.createElement('div');
  if (who === 'sister') {
    av.className = 'mini-avatar';
    av.innerHTML = SISTER_FACE;
  } else {
    av.className = 'mini-avatar kid-face';
    av.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#7fb3e0" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>';
  }
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(av);
  row.appendChild(b);
  historyEl.appendChild(row);
  historyEl.scrollTop = historyEl.scrollHeight;
  return b;
}

function showToast(msg) {
  toast.textContent = msg;
  toast.style.opacity = 1;
  setTimeout(() => toast.style.opacity = 0, 2500);
}

/* ---------- 说话（TTS + 口型 + 表情） ---------- */
async function speak(text, mood = 'idle') {
  setMood(mood);
  await tts.speak(text, {
    onStart() { avatar.classList.add('speaking'); },
    onMouth(f) { setMouth(f); },
    onEnd() {
      avatar.classList.remove('speaking');
      setMouth(0);
      setTimeout(() => setMood('idle'), 200);
    },
    onFallback() { showToast('小星姐姐嗓子有点哑，我们看她写字吧'); },
  });
}

/* ---------- 一轮对话 ---------- */
async function handleKidInput(text) {
  if (busy || !text.trim()) return;
  busy = true;
  setMood('thinking');
  const r = await replySmart(text);
  addBubble(r.text, 'sister');
  await speak(r.text, r.mood);
  busy = false;
}

/* ---------- 长按说话（按下时暂停姐姐说话 + 整页高亮 + 麦克风上方实时气泡） ---------- */
let pressing = false;
let pressStartAt = 0;
let secTimer = null;   // 录音秒数
const liveBubble = document.getElementById('live-bubble');

function startSecCounter() {
  const el = document.getElementById('record-secs');
  const t0 = Date.now();
  el.textContent = '0';
  clearInterval(secTimer);
  secTimer = setInterval(() => { el.textContent = Math.floor((Date.now() - t0) / 1000); }, 500);
}
function stopSecCounter() { clearInterval(secTimer); }

async function onPressStart(e) {
  e.preventDefault();
  if (pressing) return;
  if (!asr.supported || !asr.hasKey) {
    showToast(!asr.supported ? '这个浏览器不支持语音' : '还没有配置 API Key');
    return;
  }
  pressing = true;
  pressStartAt = Date.now();
  // 把手指/鼠标锁定在按钮上：滑出按钮边缘也算按着，只有真正抬手才结束
  try { micBtn.setPointerCapture(e.pointerId); } catch {}
  tts.stop();                       // 孩子说话时姐姐立即安静
  avatar.classList.remove('speaking');
  setMouth(0);
  busy = false;                     // 打断进行中的回复

  // 麦克风上方的实时气泡立即出现
  liveBubble.textContent = '正在听…';
  liveBubble.classList.add('live');

  const ok = await asr.startLive(
    text => { liveBubble.textContent = sanitize(text); liveBubble.classList.remove('live'); },
    () => { showToast('说得有点长哦，先到这里~'); onPressEnd(); }
  );
  if (!ok) {
    pressing = false;
    document.body.classList.remove('recording');
    micBtn.classList.remove('recording');
    stopSecCounter();
    showToast('麦克风打不开，请检查权限');
    return;
  }
  micBtn.classList.add('recording');
  document.body.classList.add('recording');
  startSecCounter();
}

async function onPressEnd() {
  if (!pressing) return;
  pressing = false;
  micBtn.classList.remove('recording');
  document.body.classList.remove('recording');
  stopSecCounter();
  const text = await asr.stopLive();
  liveBubble.textContent = '正在识别…';
  if (!text) {
    // 按得太短（误触）只提示不播语音；认真说了但没识别出来才播"没听清"
    if (Date.now() - pressStartAt < 1500) {
      showToast('按住按钮再说话哦');
    } else {
      await speak('小星姐姐没听清，你可以再说一次吗？', 'thinking');
    }
    return;
  }
  const safeText = sanitize(text);
  const b = addBubble(safeText, 'kid');
  b.onclick = () => speak(safeText); // 点击朗读，辅助识字
  await handleKidInput(safeText);
}

micBtn.addEventListener('pointerdown', onPressStart);
micBtn.addEventListener('pointerup', onPressEnd);
micBtn.addEventListener('pointercancel', onPressEnd);
micBtn.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 启动：连记忆库 -> 灌入事实 -> 回显历史 ---------- */
(async () => {
  await store.init();
  memory.hydrate(await store.loadFacts());
  const past = await store.loadHistory(40);
  if (past.length) {
    for (const m of past) {
      const b = addBubble(m.content, m.role === 'user' ? 'kid' : 'sister');
      if (m.role === 'user') b.onclick = () => speak(m.content);
    }
    setMood('idle');
  } else {
    const g = greeting();
    addBubble(g, 'sister');
    await speak(g, 'happy');
  }
})();

/* ---------- 父母设置（右上角齿轮 -> 密码 666 -> 弹窗） ---------- */
const PARENT_PASSWORD = '666';
const VALUE_TAGS = ['诚实', '勇敢', '友善', '分享', '不攀比', '爱劳动', '守时'];
const SAMPLE_TEXT = '你好呀，我是小星姐姐，今天想和我聊点什么呢？';

const settingsBtn = document.getElementById('settings-btn');
const gateEl = document.getElementById('gate');
const gateCard = document.getElementById('gate-card');
const gatePass = document.getElementById('gate-pass');
const gateHint = document.getElementById('gate-hint');
const settingsEl = document.getElementById('settings');
const settingsBody = document.getElementById('settings-body');
const keyInput = document.getElementById('set-key');
const engineLabel = document.getElementById('set-engine');
const logEl = document.getElementById('set-log');

let parentCfg = getParentConfig();

function log(msg) {
  const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
}

function showEngine() {
  engineLabel.textContent = tts.hasApiKey()
    ? 'Key 已保存 ｜ 引擎: CosyVoice（失败自动降级 Web Speech）'
    : '未配置 Key ｜ 引擎: Web Speech（机器人音，建议配置 Key）';
  keyInput.placeholder = tts.hasApiKey() ? '已保存（sk-****）' : '百炼 API Key（sk-...，千问+语音共用）';
}

/* 核心思想 / 禁止话题 */
function renderTags(rowEl, list, all, onToggle, onRemove) {
  rowEl.innerHTML = '';
  for (const tag of all) {
    const on = list.includes(tag);
    const b = document.createElement('button');
    b.className = 'btn small ' + (on ? '' : 'ghost');
    b.textContent = tag + (on ? ' ✓' : '');
    b.onclick = () => { onToggle(tag); renderAll(); };
    rowEl.appendChild(b);
  }
  for (const tag of list) {
    if (all.includes(tag)) continue;
    const b = document.createElement('button');
    b.className = 'btn small';
    b.textContent = tag + ' ✕';
    b.title = '点击删除';
    b.onclick = () => { onRemove(tag); renderAll(); };
    rowEl.appendChild(b);
  }
}

function renderAll() {
  renderTags(
    document.getElementById('set-values-row'), parentCfg.values, VALUE_TAGS,
    tag => {
      parentCfg.values = parentCfg.values.includes(tag)
        ? parentCfg.values.filter(v => v !== tag)
        : [...parentCfg.values, tag];
      setParentConfig(parentCfg);
    },
    () => {}
  );
  renderTags(
    document.getElementById('set-forbidden-row'), parentCfg.forbiddenTopics, [],
    () => {},
    tag => {
      parentCfg.forbiddenTopics = parentCfg.forbiddenTopics.filter(v => v !== tag);
      setParentConfig(parentCfg);
    }
  );
  document.getElementById('set-custom-value').value = parentCfg.customValue || '';
}

/* 音色网格 */
const grid = document.getElementById('voice-grid');
document.getElementById('set-voice-count').textContent = COSYVOICE_VOICES.length;
const VOICE_GROUPS = [
  { before: 0, label: '温柔女声（姐姐人设推荐）' },
  { before: 18, label: '童声' },
  { before: 23, label: '男声 / 长辈 / 特色' },
];

function audition(text) {
  tts.speak(text, {
    onStart() { log('开始播放'); },
    onEnd() { log('播放结束'); },
    onDegrade(engine) { log('CosyVoice 调用失败，本次降级到 ' + engine); },
    onFallback() { log('语音不可用，已降级为文字'); },
  });
}

function renderVoices() {
  grid.innerHTML = '';
  COSYVOICE_VOICES.forEach((v, i) => {
    const g = VOICE_GROUPS.find(x => x.before === i);
    if (g) {
      const lbl = document.createElement('div');
      lbl.className = 'group-label';
      lbl.textContent = g.label;
      grid.appendChild(lbl);
    }
    const card = document.createElement('div');
    card.className = 'vcard' + (tts.cosyVoiceId === v.id ? ' selected' : '');
    card.innerHTML = `
      <div class="vrow"><span class="vname">${v.name}</span><span class="badge">当前</span></div>
      <div class="vtrait">${v.trait}</div>
      <div class="vrow"><button class="btn small" data-v="${v.id}">试听并选中</button></div>`;
    card.querySelector('button').onclick = () => {
      tts.setCosyVoice(v.id);
      renderVoices();
      log('选中音色: ' + v.name + '（' + v.trait + '）');
      audition(SAMPLE_TEXT);
    };
    grid.appendChild(card);
  });
}

/* 语音参数 */
function syncSliders() {
  document.getElementById('set-rate').value = tts.rate;
  document.getElementById('set-rate-v').textContent = tts.rate.toFixed(2);
  document.getElementById('set-vol').value = tts.volume;
  document.getElementById('set-vol-v').textContent = tts.volume.toFixed(2);
  document.getElementById('set-sfx').value = sfx.volume;
  document.getElementById('set-sfx-v').textContent = sfx.volume.toFixed(2);
  document.getElementById('set-tts-on').checked = tts.enabled;
}

document.getElementById('set-rate').oninput = e => {
  tts.setRate(+e.target.value);
  document.getElementById('set-rate-v').textContent = (+e.target.value).toFixed(2);
};
document.getElementById('set-vol').oninput = e => {
  tts.setVolume(+e.target.value);
  document.getElementById('set-vol-v').textContent = (+e.target.value).toFixed(2);
};
document.getElementById('set-sfx').oninput = e => {
  sfx.setVolume(+e.target.value);
  document.getElementById('set-sfx-v').textContent = (+e.target.value).toFixed(2);
};
document.getElementById('set-tts-on').onchange = e => tts.setEnabled(e.target.checked);

/* API Key */
document.getElementById('set-key-save').onclick = () => {
  const k = keyInput.value.trim();
  if (!k) return;
  tts.setApiKey(k);
  keyInput.value = '';
  showEngine();
  log('API Key 已保存');
};
document.getElementById('set-key-clear').onclick = () => {
  tts.setApiKey(null);
  keyInput.value = '';
  showEngine();
  log('API Key 已清除');
};

document.getElementById('set-custom-value').onchange = e => {
  parentCfg.customValue = e.target.value.trim().slice(0, 20);
  setParentConfig(parentCfg);
  log('自定义核心思想: ' + (parentCfg.customValue || '(空)'));
};
document.getElementById('set-custom-forbidden').onkeydown = e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim();
  if (!v) return;
  if (!parentCfg.forbiddenTopics.includes(v)) {
    parentCfg.forbiddenTopics.push(v);
    setParentConfig(parentCfg);
    log('新增禁止话题: ' + v);
  }
  e.target.value = '';
  renderAll();
};

/* 密码门 */
function openGate() {
  tts.stop();
  gateHint.textContent = '请输入密码';
  gatePass.value = '';
  gateEl.classList.add('show');
  setTimeout(() => gatePass.focus(), 50);
}
function closeGate() {
  gateEl.classList.remove('show');
  gatePass.value = '';
}
function closeSettings() {
  settingsEl.classList.remove('show');
}
function refreshDbStatus() {
  const el = document.getElementById('set-db');
  el.textContent = '检查中…';
  store.status().then(s => {
    el.textContent = s.mode === 'sqlite'
      ? `SQLite 已连接 ｜ ${s.messages} 条对话 ｜ data/memory.db`
      : '未连接本地记忆库，暂存浏览器（启动 tools/memory_server.py 后刷新页面自动迁入）';
  }).catch(() => {
    el.textContent = '记忆库状态读取失败';
  });
}

function openSettingsPanel() {
  gateEl.classList.remove('show');
  gatePass.value = '';
  parentCfg = getParentConfig();
  showEngine();
  syncSliders();
  renderAll();
  renderVoices();
  refreshDbStatus();
  settingsEl.classList.add('show');
  settingsBody.scrollTop = 0;
}
function tryPass() {
  if (gatePass.value.trim() === PARENT_PASSWORD) { openSettingsPanel(); return; }
  gateCard.classList.remove('shake');
  void gateCard.offsetWidth;
  gateCard.classList.add('shake');
  gateHint.textContent = '密码不对，再想想';
  gatePass.value = '';
  gatePass.focus();
}

settingsBtn.onclick = openGate;
document.getElementById('gate-ok').onclick = tryPass;
document.getElementById('gate-cancel').onclick = closeGate;
gatePass.addEventListener('keydown', e => { if (e.key === 'Enter') tryPass(); });
gateEl.addEventListener('click', e => { if (e.target === gateEl) closeGate(); });
document.getElementById('settings-close').onclick = closeSettings;
settingsEl.addEventListener('click', e => { if (e.target === settingsEl) closeSettings(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (settingsEl.classList.contains('show')) closeSettings();
  else if (gateEl.classList.contains('show')) closeGate();
});
</script>
