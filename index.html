<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小星姐姐 — 配置页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #FFF8F0;
    color: #5a4a42;
    font-size: 16px;
    padding: 24px;
    max-width: 960px;
    margin: 0 auto;
  }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  h2 { font-size: 18px; font-weight: 600; margin: 24px 0 12px; color: #8a6f5c; }
  .sub { font-size: 14px; color: #a08b80; }

  .card {
    background: #fff;
    border: 2px solid #f0dcc8;
    border-radius: 20px;
    padding: 16px 20px;
    margin-bottom: 12px;
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn {
    font-size: 16px; padding: 10px 20px;
    border: none; border-radius: 16px;
    background: #ffb37e; color: #fff;
    cursor: pointer; font-family: inherit;
  }
  .btn:active { background: #f09c60; }
  .btn.ghost { background: #E3F2FD; color: #5a4a42; }
  .btn.small { font-size: 14px; padding: 6px 14px; border-radius: 12px; }

  input[type=text], input[type=password] {
    font-size: 16px; padding: 10px 14px;
    border: 2px solid #f0dcc8; border-radius: 14px;
    background: #fff; color: #5a4a42;
    font-family: inherit; width: 320px;
  }
  input[type=range] { width: 140px; }
  .val { font-size: 14px; color: #a08b80; min-width: 36px; }

  /* 音色卡片网格 */
  #voice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .vcard {
    background: #fff;
    border: 2px solid #f0dcc8;
    border-radius: 16px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .vcard.selected { border-color: #ffb37e; background: #FFF3E0; }
  .vcard .vname { font-size: 16px; font-weight: 600; }
  .vcard .vtrait { font-size: 13px; color: #a08b80; }
  .vcard .vrow { display: flex; justify-content: space-between; align-items: center; }
  .badge { font-size: 12px; color: #ff9a5c; display: none; }
  .vcard.selected .badge { display: inline; }
  .group-label { grid-column: 1 / -1; font-size: 14px; color: #8a6f5c; margin-top: 8px; }

  /* 试听状态脸（验证口型联动用） */
  #face {
    width: 72px; height: 72px;
    background: #FFE8D6; border-radius: 50%;
    position: relative; flex-shrink: 0;
  }
  .eye { position: absolute; top: 24px; width: 7px; height: 9px; background: #5a4a42; border-radius: 50%; }
  .eye.l { left: 19px; } .eye.r { right: 19px; }
  #mouth {
    position: absolute; left: 50%; top: 46px; transform: translateX(-50%);
    background: #c96f5e; border-radius: 50%;
    width: 16px; height: 4px; transition: height 0.12s, width 0.12s;
  }
  #mouth.f1 { width: 16px; height: 9px; }
  #mouth.f2 { width: 19px; height: 12px; }

  #log {
    font-size: 13px; color: #a08b80;
    max-height: 140px; overflow-y: auto;
    background: #fff; border: 2px solid #f0dcc8; border-radius: 14px;
    padding: 10px 14px; white-space: pre-wrap;
  }
  #engine-label { font-size: 14px; color: #a08b80; }
</style>
</head>
<body>
  <h1>小星姐姐 — 配置页</h1>
  <div class="sub">语音与接口配置（后续并入父母面板隐蔽入口）。孩子的聊天页在 chat.html（开发中）。</div>

  <h2>接口</h2>
  <div class="card">
    <div class="row">
      <input type="password" id="api-key" placeholder="百炼 API Key（sk-...，千问+语音共用）">
      <button class="btn" id="save-key">保存</button>
      <button class="btn ghost" id="clear-key">清除</button>
    </div>
    <div class="row" style="margin-top:10px;">
      <span id="engine-label"></span>
    </div>
  </div>

  <h2>语音参数</h2>
  <div class="card">
    <div class="row">
      <div id="face">
        <div class="eye l"></div><div class="eye r"></div>
        <div id="mouth"></div>
      </div>
      <label>语速 <input type="range" id="rate" min="0.7" max="1.2" step="0.01" value="0.88"> <span class="val" id="rate-v">0.88</span></label>
      <label>音量 <input type="range" id="vol" min="0" max="1" step="0.05" value="0.9"> <span class="val" id="vol-v">0.90</span></label>
      <label>音效音量 <input type="range" id="sfx-vol" min="0" max="1" step="0.05" value="0.3"> <span class="val" id="sfx-vol-v">0.30</span></label>
      <label><input type="checkbox" id="tts-on" checked> 语音开关</label>
    </div>
  </div>

  <h2>音色（共 <span id="voice-count"></span> 个，点击卡片试听即选中）</h2>
  <div id="voice-grid"></div>

  <h2>核心思想（注入千问 System Prompt）</h2>
  <div class="card">
    <div class="row" id="values-row"></div>
    <div class="row" style="margin-top:10px;">
      <input type="text" id="custom-value" placeholder="自定义核心思想（20字内）" maxlength="20" style="width:240px;">
    </div>
  </div>

  <h2>禁止话题（千问绝不主动提及，孩子提到就引导问父母）</h2>
  <div class="card">
    <div class="row" id="forbidden-row"></div>
    <div class="row" style="margin-top:10px;">
      <input type="text" id="custom-forbidden" placeholder="添加禁止话题，回车确认" style="width:240px;">
    </div>
    <div class="sub" style="margin-top:8px;">回复发出前还会做一次关键词扫描，命中同样拦截。</div>
  </div>

  <h2>日志</h2>
  <div id="log"></div>

<script type="module">
import { tts, COSYVOICE_VOICES } from './js/tts.js';
import { sfx } from './js/sfx.js';
import { getParentConfig, setParentConfig } from './js/qwen.js';

/* ---------- 核心思想 / 禁止话题配置 ---------- */
const VALUE_TAGS = ['诚实', '勇敢', '友善', '分享', '不攀比', '爱劳动', '守时'];
let parentCfg = getParentConfig();

function renderTags(rowEl, list, all, onToggle, onRemove) {
  rowEl.innerHTML = '';
  for (const tag of all) {
    const on = list.includes(tag);
    const b = document.createElement('button');
    b.className = 'btn small ' + (on ? '' : 'ghost');
    b.textContent = tag + (on ? ' ✓' : '');
    b.onclick = () => { onToggle(tag); renderAll(); };
    rowEl.appendChild(b);
  }
  // 自定义项（不在预设里的）显示为可删除
  for (const tag of list) {
    if (all.includes(tag)) continue;
    const b = document.createElement('button');
    b.className = 'btn small';
    b.textContent = tag + ' ✕';
    b.title = '点击删除';
    b.onclick = () => { onRemove(tag); renderAll(); };
    rowEl.appendChild(b);
  }
}

function renderAll() {
  renderTags(
    document.getElementById('values-row'), parentCfg.values, VALUE_TAGS,
    tag => { parentCfg.values = parentCfg.values.includes(tag) ? parentCfg.values.filter(v => v !== tag) : [...parentCfg.values, tag]; setParentConfig(parentCfg); },
    () => {}
  );
  renderTags(
    document.getElementById('forbidden-row'), parentCfg.forbiddenTopics, [],
    () => {},
    tag => { parentCfg.forbiddenTopics = parentCfg.forbiddenTopics.filter(v => v !== tag); setParentConfig(parentCfg); }
  );
  document.getElementById('custom-value').value = parentCfg.customValue || '';
}
document.getElementById('custom-value').onchange = e => {
  parentCfg.customValue = e.target.value.trim().slice(0, 20);
  setParentConfig(parentCfg);
  log('自定义核心思想: ' + (parentCfg.customValue || '(空)'));
};
document.getElementById('custom-forbidden').onkeydown = e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim();
  if (!v) return;
  if (!parentCfg.forbiddenTopics.includes(v)) {
    parentCfg.forbiddenTopics.push(v);
    setParentConfig(parentCfg);
    log('新增禁止话题: ' + v);
  }
  e.target.value = '';
  renderAll();
};
renderAll();

const SAMPLE_TEXT = '你好呀，我是小星姐姐，今天想和我聊点什么呢？';
const mouth = document.getElementById('mouth');
const logEl = document.getElementById('log');

function log(msg) {
  const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
}
function audition(text) {
  tts.speak(text, {
    onStart() { log('开始播放'); },
    onMouth(f) { mouth.className = f ? 'f' + f : ''; },
    onEnd() { mouth.className = ''; log('播放结束'); },
    onDegrade(engine) { log('注意：CosyVoice 调用失败，本次降级到 ' + engine); },
    onFallback() { log('语音不可用，已降级为文字'); },
  });
}

/* ---------- API Key ---------- */
const keyInput = document.getElementById('api-key');
const engineLabel = document.getElementById('engine-label');
function showEngine() {
  engineLabel.textContent = tts.hasApiKey()
    ? 'Key 已保存 ｜ 引擎: CosyVoice（失败自动降级 Web Speech）'
    : '未配置 Key ｜ 引擎: Web Speech（机器人音，建议配置 Key）';
}
document.getElementById('save-key').onclick = () => {
  const k = keyInput.value.trim();
  if (!k) return;
  tts.setApiKey(k);
  keyInput.value = '';
  keyInput.placeholder = '已保存（sk-****）';
  showEngine();
  log('API Key 已保存');
};
document.getElementById('clear-key').onclick = () => {
  tts.setApiKey(null);
  keyInput.placeholder = '百炼 API Key（sk-...，千问+语音共用）';
  showEngine();
  log('API Key 已清除');
};
showEngine();
if (tts.hasApiKey()) keyInput.placeholder = '已保存（sk-****）';

/* ---------- 语音参数 ---------- */
document.getElementById('tts-on').onchange = e => tts.setEnabled(e.target.checked);
document.getElementById('rate').oninput = e => {
  tts.setRate(+e.target.value);
  document.getElementById('rate-v').textContent = (+e.target.value).toFixed(2);
};
document.getElementById('vol').oninput = e => {
  tts.setVolume(+e.target.value);
  document.getElementById('vol-v').textContent = (+e.target.value).toFixed(2);
};
document.getElementById('sfx-vol').oninput = e => {
  sfx.setVolume(+e.target.value);
  document.getElementById('sfx-vol-v').textContent = (+e.target.value).toFixed(2);
};

/* ---------- 音色网格 ---------- */
const grid = document.getElementById('voice-grid');
document.getElementById('voice-count').textContent = COSYVOICE_VOICES.length;
const GROUPS = [
  { before: 0, label: '温柔女声（姐姐人设推荐）' },
  { before: 18, label: '童声' },
  { before: 23, label: '男声 / 长辈 / 特色' },
];
function renderVoices() {
  grid.innerHTML = '';
  COSYVOICE_VOICES.forEach((v, i) => {
    const g = GROUPS.find(g => g.before === i);
    if (g) {
      const lbl = document.createElement('div');
      lbl.className = 'group-label';
      lbl.textContent = g.label;
      grid.appendChild(lbl);
    }
    const card = document.createElement('div');
    card.className = 'vcard' + (tts.cosyVoiceId === v.id ? ' selected' : '');
    card.innerHTML = `
      <div class="vrow"><span class="vname">${v.name}</span><span class="badge">当前</span></div>
      <div class="vtrait">${v.trait}</div>
      <div class="vrow"><button class="btn small" data-v="${v.id}">试听并选中</button></div>`;
    card.querySelector('button').onclick = () => {
      tts.setCosyVoice(v.id);
      renderVoices();
      log('选中音色: ' + v.name + '（' + v.trait + '）');
      audition(SAMPLE_TEXT);
    };
    grid.appendChild(card);
  });
}
renderVoices();

/* ---------- 音效试听（双击音效滑块区域不便，留日志即可） ---------- */
log('配置页就绪。引擎: ' + tts.engine + ' ｜ 当前音色: ' + tts.voiceName);
</script>
</body>
</html>
